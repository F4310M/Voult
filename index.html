<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Password Vault">
  <meta name="theme-color" content="#0E1116" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#F3F5F8" media="(prefers-color-scheme: light)">
  
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: http:; connect-src 'none';">
  
  <title>Password Vault</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" sizes="300x300" href="apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css?v=20261018-restyle">
  <link rel="stylesheet" href="theme.css?v=20261018-restyle">
  
  <style>
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- SCHERMATA SBLOCCO -->
  <div id="screen-unlock" class="screen active">
    <div class="unlock-container">
      <div class="app-icon"><svg class="app-logo" viewBox="0 0 256 256" aria-hidden="true"><rect x="16" y="16" width="224" height="224" rx="56" fill="#1E90FF"/><rect x="78" y="120" width="100" height="70" rx="15" fill="#fff"/><path d="M98 120V90a30 30 0 0 1 60 0v30" fill="none" stroke="#fff" stroke-width="14" stroke-linecap="round"/><line x1="128" y1="145" x2="128" y2="165" stroke="#1E90FF" stroke-width="8" stroke-linecap="round"/><circle cx="128" cy="145" r="10" fill="#1E90FF"/></svg></div>
      <h1 class="app-title">Password Vault Security</h1>
      <p class="app-subtitle">Il tuo archivio, sul tuo dispositivo.</p>

      <div class="card">
        <!-- Bottone corretto: no doppi clic, no accept -->
        <input type="file" id="file-input" style="display:none">
        <button class="btn btn-secondary" id="btn-pick-file">
          <svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7.5A2.5 2.5 0 0 1 5.5 5h4l2 2.5h7A2.5 2.5 0 0 1 21 10v7.5a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 17.5z"/></svg>Seleziona file .vault
        </button>
        <div class="file-name muted" id="file-name-display">Nessun file selezionato</div>

        <div class="input-group">
          <label for="master-password">Master Password</label>
          <input type="password" id="master-password" class="input" placeholder="Master Password"
                 autocomplete="current-password" autocorrect="off" autocapitalize="none" spellcheck="false">
          <button class="input-toggle" id="btn-toggle-password" aria-label="Mostra password"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
        </div>

        <button class="btn btn-primary" id="btn-unlock" disabled>
          <svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2.5"/><path d="M8 11V8a4 4 0 0 1 7.5-2"/></svg>Sblocca vault
        </button>

        <div class="error-msg hidden" id="unlock-error"></div>
      </div>

      <div class="loading-overlay hidden" id="loading-overlay">
        <div class="spinner"></div>
        <p class="loading-text">Decifrazione in corso…</p>
        <p class="loading-sub">Potrebbe richiedere alcuni secondi</p>
      </div>

      <p class="footer-note"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l7 3v5.5c0 4.5-3 8-7 9.5-4-1.5-7-5-7-9.5V6z"/><path d="M9 12l2 2 4-4"/></svg>Il vault viene decifrato localmente.<br>La password non lascia mai il dispositivo.</p>
    </div>
  </div>

  <!-- SCHERMATA LISTA PASSWORD -->
  <div id="screen-vault" class="screen hidden">
    <header class="vault-header">
      <div class="header-top">
        <span class="header-title"><svg class="header-logo" viewBox="0 0 256 256" aria-hidden="true"><rect x="16" y="16" width="224" height="224" rx="56" fill="#1E90FF"/><rect x="78" y="120" width="100" height="70" rx="15" fill="#fff"/><path d="M98 120V90a30 30 0 0 1 60 0v30" fill="none" stroke="#fff" stroke-width="14" stroke-linecap="round"/><line x1="128" y1="145" x2="128" y2="165" stroke="#1E90FF" stroke-width="8" stroke-linecap="round"/><circle cx="128" cy="145" r="10" fill="#1E90FF"/></svg>Password Vault</span>
        <button class="btn-icon" id="btn-lock" title="Blocca vault" aria-label="Blocca vault"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2.5"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></button>
      </div>
      <div class="search-row">
        <div class="filter-control">
        <input type="search" id="search-input" class="search-input" placeholder="Cerca…"
               aria-label="Cerca credenziali" autocorrect="off" autocapitalize="none" spellcheck="false">
        <button id="clear-search" class="clear-filter hidden" aria-label="Cancella ricerca">×</button>
        </div>
        <div class="filter-control">
        <select id="category-filter" class="category-filter">
          <option value="">Tutte</option>
        </select>
        <button id="clear-category" class="clear-filter hidden" aria-label="Rimuovi filtro categoria">×</button>
        </div>
      </div>
    </header>

    <div class="stats-bar" id="stats-bar"></div>

    <main class="entries-list" id="entries-list"></main>

    <div class="empty-state hidden" id="empty-state">
      <div class="empty-icon"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></div>
      <p>Nessuna credenziale trovata</p>
    </div>
  </div>

  <!-- SCHERMATA DETTAGLIO PASSWORD -->
  <div id="screen-detail" class="screen hidden">
    <header class="detail-header">
      <button class="btn-back detail-back" id="btn-back" aria-label="Torna all’elenco"><span class="arrow-icon back-arrow" aria-hidden="true">➜</span><span class="detail-title" id="detail-title-header"></span></button>
    </header>
    <main class="detail-content" id="detail-content"></main>
  </div>

  <nav id="vault-actions" class="vault-actions hidden" aria-label="Archivio locale">
    <button id="action-file"><span><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7.5A2.5 2.5 0 0 1 5.5 5h4l2 2.5h7A2.5 2.5 0 0 1 21 10v7.5a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 17.5z"/></svg> Cambia file vault</span><small id="local-file-status"></small></button>
  </nav>
  <div class="toast hidden" id="toast" role="status"></div>

  <dialog id="link-confirm" aria-labelledby="link-confirm-title">
    <h2 id="link-confirm-title">Aprire questo URL?</h2>
    <p id="link-confirm-url"></p>
    <div class="link-confirm-actions">
      <button id="link-confirm-no" autofocus>No</button>
      <a id="link-confirm-yes" target="_blank" rel="noopener noreferrer">Sì</a>
    </div>
  </dialog>
  <script src="app.js?v=20261018-restyle"></script>
</body>
</html>
