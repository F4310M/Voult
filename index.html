<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Password Vault">
  <meta name="theme-color" content="#0d0d0f">
  
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: http:; connect-src 'none';">
  
  <title>Password Vault</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" sizes="300x300" href="apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css?v=local4">
  
  <style>
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- SCHERMATA SBLOCCO -->
  <div id="screen-unlock" class="screen active">
    <div class="unlock-container">
      <div class="app-icon">🔐</div>
      <h1 class="app-title">Password Vault</h1>
      <p class="app-subtitle">Il tuo archivio, sul tuo dispositivo.</p>

      <div class="card">
        <!-- Bottone corretto: no doppi clic, no accept -->
        <input type="file" id="file-input" style="display:none">
        <button class="btn btn-secondary" id="btn-pick-file">
          📁 Seleziona file .vault
        </button>
        <div class="file-name muted" id="file-name-display">Nessun file selezionato</div>

        <div class="input-group">
          <label for="master-password">Master Password</label>
          <input type="password" id="master-password" class="input" placeholder="Master Password"
                 autocomplete="current-password" autocorrect="off" autocapitalize="none" spellcheck="false">
          <button class="input-toggle" id="btn-toggle-password" aria-label="Mostra password">👁</button>
        </div>

        <button class="btn btn-primary" id="btn-unlock" disabled>
          🔓 Sblocca Vault
        </button>

        <div class="error-msg hidden" id="unlock-error"></div>
      </div>

      <div class="loading-overlay hidden" id="loading-overlay">
        <div class="spinner"></div>
        <p class="loading-text">Decifrazione in corso…</p>
        <p class="loading-sub">Potrebbe richiedere alcuni secondi</p>
      </div>

      <p class="footer-note">🔒 Il vault viene decifrato localmente.<br>La password non lascia mai il dispositivo.</p>
    </div>
  </div>

  <!-- SCHERMATA LISTA PASSWORD -->
  <div id="screen-vault" class="screen hidden">
    <header class="vault-header">
      <div class="header-top">
        <span class="header-title">🔐 Password Vault</span>
        <button class="btn-icon" id="btn-lock" title="Blocca vault" aria-label="Blocca vault">🔒</button>
      </div>
      <div class="search-row">
        <div class="filter-control">
        <input type="search" id="search-input" class="search-input" placeholder="🔍 Cerca…"
               aria-label="Cerca credenziali" autocorrect="off" autocapitalize="none" spellcheck="false">
        <button id="clear-search" class="clear-filter hidden" aria-label="Cancella ricerca">×</button>
        </div>
        <div class="filter-control">
        <select id="category-filter" class="category-filter">
          <option value="">Tutte</option>
        </select>
        <button id="clear-category" class="clear-filter hidden" aria-label="Rimuovi filtro categoria">×</button>
        </div>
      </div>
    </header>

    <div class="stats-bar" id="stats-bar"></div>

    <main class="entries-list" id="entries-list"></main>

    <div class="empty-state hidden" id="empty-state">
      <div class="empty-icon">🔍</div>
      <p>Nessuna credenziale trovata</p>
    </div>
  </div>

  <!-- SCHERMATA DETTAGLIO PASSWORD -->
  <div id="screen-detail" class="screen hidden">
    <header class="detail-header">
      <button class="btn-back detail-back" id="btn-back" aria-label="Torna all’elenco"><span class="arrow-icon back-arrow" aria-hidden="true">➜</span><span class="detail-title" id="detail-title-header"></span></button>
    </header>
    <main class="detail-content" id="detail-content"></main>
  </div>

  <nav id="vault-actions" class="vault-actions hidden" aria-label="Archivio locale">
    <button id="action-file"><span>↻ Cambia file vault</span><small id="local-file-status"></small></button>
  </nav>
  <div class="toast hidden" id="toast" role="status"></div>

  <dialog id="link-confirm" aria-labelledby="link-confirm-title">
    <h2 id="link-confirm-title">Aprire questo URL?</h2>
    <p id="link-confirm-url"></p>
    <div class="link-confirm-actions">
      <button id="link-confirm-no" autofocus>No</button>
      <a id="link-confirm-yes" target="_blank" rel="noopener noreferrer">Sì</a>
    </div>
  </dialog>
  <script src="app.js?v=local4"></script>
</body>
</html>
